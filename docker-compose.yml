
name: joorkonberim

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    expose:
      - "8000"
    networks:
      - joorkonberim

  frontend:
    build:
      context: ./jourkonberim2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - joorkonberim

networks:
  joorkonberim:
    name: joorkonberim
    driver: bridge
